name: Workbench CPU regression
on:
  push:
    branches: [main, 'ui/unified-experiment-workbench']
    paths:
      - 'evaluation/scripts/**'
      - 'train/dashboard*'
      - 'workbench-cli/**'
      - 'tests/test_resource_downloads.py'
      - 'tests/test_workbench_resource_safety.py'
      - 'tests/workbench_download_ui.cjs'
      - 'tests/workbench_layout_browser.cjs'
      - 'tests/unified_workbench_browser.cjs'
      - 'tests/test_workbench_annotations.py'
      - '.github/workflows/workbench-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            evaluation/scripts
            train
            workbench-cli
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest
      - run: python -m compileall -q evaluation/scripts train workbench-cli
      - run: python -m pytest -q tests/test_resource_downloads.py tests/test_workbench_resource_safety.py tests/test_registry_storage.py -k 'not http_resource_operations'
      - run: python -m pytest -q tests/test_workbench_annotations.py
      - run: node --check evaluation/scripts/benchmark_workbench.js && node --check evaluation/scripts/libero_workflow.js
      - run: node tests/workbench_download_ui.cjs
      - run: |
          node --check evaluation/scripts/resource_downloads.js
          node --check evaluation/scripts/registry_storage.js
          node --check evaluation/scripts/agent_experiments.js
          node --check train/dashboard.js
          node -e 'const fs=require("fs");for(const p of ["evaluation/scripts/result_viewer.html","evaluation/scripts/registry_view.html","train/dashboard.html"]){for(const m of fs.readFileSync(p,"utf8").matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){if(m[1].trim())new Function(m[1]);}}'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            evaluation/scripts
            train
            tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/workbench_layout_browser.cjs
      - run: node tests/unified_workbench_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-layout-screenshots
          path: workbench-screenshots/
