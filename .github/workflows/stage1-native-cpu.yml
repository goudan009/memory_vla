name: Stage1 native preparation CPU checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage1_native*.py'
      - 'tests/test_stage1_native.py'
      - 'train/run_identity.py'
      - 'train/v21_workbench.py'
      - 'tests/test_v21_workbench.py'
      - '.github/workflows/stage1-native-cpu.yml'
  pull_request:
    paths:
      - 'scripts/stage1_native*.py'
      - 'tests/test_stage1_native.py'
      - '.github/workflows/stage1-native-cpu.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/stage1_native_prepare.py
            scripts/stage1_native_train.py
            tests/test_stage1_native.py
            train/run_identity.py
            train/v21_workbench.py
            tests/test_v21_workbench.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pyarrow pytest
      - run: python -m compileall -q scripts/stage1_native_prepare.py scripts/stage1_native_train.py
      - run: PYTHONPATH=scripts python -m pytest -q tests/test_stage1_native.py
      - run: PYTHONPATH=scripts:train python -m pytest -q tests/test_v21_workbench.py -k 'native or current_stage1'
