<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task40 人工标注</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font:14px/1.5 system-ui,sans-serif;background:#f4f6f6;color:#222}
#app{display:flex;height:100vh}
aside{width:190px;flex-shrink:0;background:#fff;border-right:1px solid #dde;overflow-y:auto;padding:12px 8px}
aside h2{margin:0 0 10px;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.04em}
.ep-item{padding:5px 10px;border-radius:5px;cursor:pointer;margin:2px 0;font-size:13px;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center}
.ep-item:hover{background:#e8f0ee}.ep-item.active{background:#e8f0ee;border-color:#17685f;font-weight:600}
.ep-item .tag{font-size:11px;padding:1px 5px;border-radius:3px;background:#eee;color:#666}
.ep-item.suc .tag{background:#d4edda;color:#0a7a40}.ep-item.fail .tag{background:#fde;color:#b03030}
main{flex:1;overflow-y:auto;padding:20px 24px}
h1{margin:0 0 4px;font-size:19px}
.subtitle{color:#666;margin:0 0 14px;font-size:13px}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog-bar{flex:1;height:6px;background:#dde;border-radius:3px}
.prog-fill{height:100%;background:#17685f;border-radius:3px;transition:width .3s}
.prog-label{font-size:12px;color:#666;white-space:nowrap}
video{width:100%;max-width:920px;display:block;background:#111;border-radius:5px;margin-bottom:16px}
.case-title{font-size:16px;font-weight:600;margin-bottom:12px;color:#17685f}
.form{max-width:580px}
.form label{display:block;margin-bottom:12px}
.form .lbl{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.form select,.form textarea{width:100%;padding:8px;border:1px solid #bcd;border-radius:4px;font:inherit;background:#fff}
.form textarea{height:65px;resize:vertical}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
button{padding:7px 16px;border:1px solid #94a4aa;border-radius:5px;background:#fff;cursor:pointer;font:inherit}
.primary{background:#17685f;border-color:#17685f;color:#fff}
.primary:hover{background:#0e544c}
button:disabled{opacity:.4;cursor:default}
#msg{font-size:13px;color:#17685f;min-height:18px}
.hidden{display:none!important}
.kbd{font-size:11px;color:#999;margin-left:6px}
#no-sel{color:#888;padding-top:40px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h2>Episodes</h2>
    <div id="ep-list"></div>
    <div style="margin-top:14px;font-size:12px;color:#888" id="aside-prog"></div>
  </aside>
  <main>
    <h1>Task40 人工标注</h1>
    <p class="subtitle">make_microwave_popcorn · 18条回合视频</p>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
      <span class="prog-label" id="prog-label">0 / 18</span>
    </div>
    <div id="no-sel">← 选择左侧 episode 开始标注</div>
    <div id="main-panel" class="hidden">
      <div class="case-title" id="case-title"></div>
      <video id="player" controls preload="metadata"></video>
      <div class="form">
        <label>
          <span class="lbl">完成到哪一步（机器人最后完成/尝试的步骤）</span>
          <select id="f-step">
            <option value="">— 请选择 —</option>
            <option value="0">0 · 未有效离开起始位置</option>
            <option value="1">1 · 离开起始 / 进入厨房区域</option>
            <option value="2">2 · 尝试开微波炉门</option>
            <option value="3">3 · 移动到爆米花袋旁</option>
            <option value="4">4 · 抓取爆米花袋</option>
            <option value="5">5 · 携带袋子移向微波炉</option>
            <option value="6">6 · 将袋子放入微波炉内</option>
            <option value="7">7 · 关闭微波炉门</option>
            <option value="8">8 · 按下启动按钮（成功完成任务）</option>
          </select>
        </label>
        <label>
          <span class="lbl">结果</span>
          <select id="f-result">
            <option value="">— 请选择 —</option>
            <option value="success">✓ 成功</option>
            <option value="failure">✗ 失败</option>
          </select>
        </label>
        <label id="reason-label" class="hidden">
          <span class="lbl">失败主要原因</span>
          <select id="f-reason">
            <option value="">— 请选择 —</option>
            <option value="decision_first_step_bag">第一步先拿袋子（应先开微波炉门）</option>
            <option value="decision_skip_to_start">开门失败后直接按启动（跳过放袋子步骤）</option>
            <option value="execution_close_door">决策正确但关门阶段执行失败</option>
            <option value="other">其他原因</option>
          </select>
        </label>
        <label>
          <span class="lbl">备注（可选）</span>
          <textarea id="f-notes" placeholder="任何值得记录的细节…"></textarea>
        </label>
        <div class="btn-row">
          <button class="primary" id="btn-save">保存<span class="kbd">Ctrl+Enter</span></button>
          <button id="btn-next">下一条<span class="kbd">→</span></button>
          <span id="msg"></span>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
'use strict';
const CASES=Array.from({length:18},(_,i)=>'C'+(i+1).toString().padStart(2,'0'));
let annotations={},current=null;

async function loadAnnotations(){
  try{const r=await fetch('/api/task40/annotations');if(r.ok)annotations=await r.json();}catch(e){}
  renderList();
}

function tagText(a){
  if(!a)return'';
  if(a.result==='success')return'成功';
  const m={decision_first_step_bag:'先拿袋',decision_skip_to_start:'跳启动',execution_close_door:'关门失败',other:'其他'};
  return m[a.failure_reason]||'失败';
}

function renderList(){
  const el=document.getElementById('ep-list');
  el.innerHTML='';
  let done=0;
  for(const c of CASES){
    const a=annotations[c];
    if(a)done++;
    const div=document.createElement('div');
    div.className='ep-item'+(c===current?' active':'')+(a?.result==='success'?' suc':a?.result==='failure'?' fail':'');
    const tag=tagText(a);
    div.innerHTML=`<span>${c}</span>${tag?`<span class="tag">${tag}</span>`:''}`;
    div.onclick=()=>selectCase(c);
    el.appendChild(div);
  }
  const pct=Math.round(done/CASES.length*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=`${done} / ${CASES.length}`;
  document.getElementById('aside-prog').textContent=`${done} / ${CASES.length} 已标注`;
}

function selectCase(c){
  current=c;
  document.getElementById('no-sel').classList.add('hidden');
  document.getElementById('main-panel').classList.remove('hidden');
  document.getElementById('case-title').textContent='案例 '+c;
  const p=document.getElementById('player');
  p.src='/api/task40/video?case='+c;
  p.load();
  const a=annotations[c]||{};
  document.getElementById('f-step').value=a.completed_step!=null?String(a.completed_step):'';
  document.getElementById('f-result').value=a.result||'';
  document.getElementById('f-reason').value=a.failure_reason||'';
  document.getElementById('f-notes').value=a.notes||'';
  document.getElementById('msg').textContent='';
  updateReason();
  renderList();
}

function updateReason(){
  const show=document.getElementById('f-result').value==='failure';
  document.getElementById('reason-label').classList.toggle('hidden',!show);
}
document.getElementById('f-result').addEventListener('change',updateReason);

async function save(){
  if(!current)return;
  const step=document.getElementById('f-step').value;
  const result=document.getElementById('f-result').value;
  const reason=document.getElementById('f-reason').value;
  const notes=document.getElementById('f-notes').value.trim();
  const msg=document.getElementById('msg');
  if(!step||!result){msg.style.color='#b03030';msg.textContent='请选择步骤和结果后再保存。';return;}
  const payload={case_id:current,completed_step:parseInt(step,10),result,
    failure_reason:result==='failure'?reason||null:null,notes,
    annotated_at:new Date().toISOString()};
  try{
    const r=await fetch('/api/task40/annotations',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||r.statusText);
    annotations=data;
    msg.style.color='#17685f';msg.textContent='✓ 已保存';
    renderList();
  }catch(e){msg.style.color='#b03030';msg.textContent='保存失败：'+e.message;}
}

function goNext(){
  const idx=CASES.indexOf(current);
  const next=CASES.find((c,i)=>i>idx&&!annotations[c])||CASES[(idx+1)%CASES.length];
  if(next)selectCase(next);
}

document.getElementById('btn-save').addEventListener('click',save);
document.getElementById('btn-next').addEventListener('click',goNext);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();save();}
  if(e.key==='ArrowRight'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))goNext();
});

updateReason();
loadAnnotations().then(()=>{
  const first=CASES.find(c=>!annotations[c])||CASES[0];
  selectCase(first);
});
</script>
</body>
</html>
