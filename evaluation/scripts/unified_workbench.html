<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoryVLA</title><link rel="stylesheet" href="/unified_workbench.css?ui=8"></head><body>
<header class="app-header"><div class="top"><a class="brand" href="/workbench"><b>M</b>MemoryVLA</a><nav id="nav" aria-label="工作台页面"></nav><div class="top-controls"><label class="scope-control"><span class="control-label">Benchmark</span><select id="benchmarks" aria-label="Benchmark 筛选"></select></label><button id="open-device-dialog" aria-haspopup="dialog">设备 ▾</button><button id="reload" title="刷新" aria-label="刷新">↻</button></div></div></header>
<dialog id="device-dialog" aria-labelledby="device-title"><div class="side-head"><h2 id="device-title">设备状态</h2><button id="close-device-dialog" aria-label="关闭">×</button></div><div id="device-content" class="device-content" role="status">读取设备…</div></dialog>
<div class="workspace"><div class="shell"><aside class="sidebar"><div class="side-head"><h2>实验目录</h2><button id="collapse" class="plain">收起</button></div><div class="side-body"><div class="filter"><label><input type="checkbox" id="engineering"> 工程检查</label></div><div id="tree" class="tree" aria-label="实验目录"></div></div><div class="side-foot" id="source-state" role="status">读取记录…</div></aside><main class="center"><div class="center-head"><h1 id="title">实验谱系</h1><span id="crumb" class="crumb"></span></div><div id="message" role="status"></div><div id="content"></div></main><aside class="inspector" aria-label="节点详情"><div class="side-head"><h2>节点详情</h2><span id="inspector-kind" class="muted"></span></div><div id="inspector" class="inspector-body"></div><div id="node-actions" class="node-actions" aria-label="节点操作" hidden></div></aside></div></div>
<script src="/unified_workbench.js?ui=8"></script></body></html>
