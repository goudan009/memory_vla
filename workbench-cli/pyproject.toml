[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-workbench"
version = "0.1.0"
description = "Command-line client for the MemoryVLA workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memory-workbench = "memory_workbench:main"

[tool.setuptools]
py-modules = ["memory_workbench"]
