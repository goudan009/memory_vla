<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task40 按真实顺序记录视频</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#24343a;background:#f4f6f6}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:24px;margin:0}h2{font-size:20px}p{color:#52646c}button,select,input,textarea{font:inherit}button{padding:7px 12px;border:1px solid #94a4aa;border-radius:5px;background:#fff;color:#24343a;cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:#17685f;border-color:#17685f;color:white}.toolbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#f4f6f6;padding:10px 0;border-block:1px solid #cbd5d8}#progress{margin-left:auto}#message{width:100%;color:#17685f;font-size:13px}.review-card{margin:22px 0;padding:18px;background:white;border:1px solid #ccd6d9;border-radius:8px}.review-card header{display:flex;align-items:center;justify-content:space-between;gap:12px}.review-card h2{margin:0}.player{position:relative;margin-top:12px;background:#111}video{width:100%;display:block;aspect-ratio:768/260;object-fit:contain}.readout{position:absolute;top:7px;left:7px;pointer-events:none;background:#111d;color:white;padding:4px 8px;font-size:13px}.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.view-label{color:#17685f}.context{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.context select{padding:6px;max-width:100%}.step{background:#f5f8f7;padding:12px;margin:10px 0;border:1px solid #d6dfdf;border-radius:5px}.step-head{display:flex;align-items:center;gap:5px}.step-head strong{margin-right:auto}.step-head button{padding:3px 9px;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.fields label{display:flex;flex-direction:column;gap:4px}.fields select{width:100%;min-width:0;padding:8px;border:1px solid #9badaf;border-radius:4px;background:white}.extra{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.extra select{max-width:100%;padding:5px}.time-label{font-size:12px;color:#5d7077}.step-note{display:block;width:100%;padding:7px;margin-top:8px;border:1px solid #b9c7ca;border-radius:4px}.finish{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.card-state{color:#17685f;font-size:13px}.quality{display:block;margin-top:12px;font-size:13px;color:#5a6d75}.quality select{padding:4px;max-width:100%}.empty{padding:12px;border:1px dashed #a7b9bb;color:#59717a}.done{border-left:4px solid #24776d}.guide{border-left:3px solid #24776d;padding:8px 12px;background:#e8f0ee}.vocabulary{max-height:350px;overflow:auto}.vocabulary li{margin:9px 0}.feedback{margin:6px 0;color:#886017;font-size:13px}.hidden,[hidden]{display:none!important}@media(max-width:680px){main{padding:10px}.review-card{padding:10px}.fields{grid-template-columns:1fr}.review-card header{align-items:flex-start;flex-direction:column}#progress{width:100%;margin:0}.readout{font-size:11px}}
</style>
<style>
.step-head{flex-wrap:wrap}.step-title{flex:1;min-width:160px}.step-title strong{display:block}.step-summary{display:block;font-size:13px;color:#52676f;overflow-wrap:anywhere}.step-tools{display:flex;gap:8px;margin:10px 0}.step-tools button{font-size:13px}.step-head .step-toggle{min-width:48px}
.confirm-feedback{margin:8px 0 0;color:#9b3e20;font-size:14px}
</style>
</head>
<body><main>
<h1>按画面真实顺序，逐步记录发生了什么</h1>
<p>先看视频。每发生一件事，就添加一步，选“做了什么”和“结果怎样”。顺序由你决定，可以重复、回头，也可以插入遗漏的动作。</p>
<div class="guide">例如：到达厨房 → 去袋子旁 → 抓袋子（反复后成功）→ 返回微波炉 → 放入（反复仍失败；门关着挡住）。不必判断属于哪个阶段，也不用判断失败原因。</div>
<details><summary>查看全部动作和对应状态选项</summary><div id="vocabulary" class="vocabulary"></div></details>
<div class="toolbar"><button id="save">保存草稿</button><button id="import">导入本版 JSON</button><button id="export" class="primary">导出顺序标注</button><input id="file" type="file" accept="application/json" hidden><span id="progress"></span><span id="message" role="status"></span></div>
<p id="dataset-info"></p><div id="cards"></div>
<script>
'use strict';
const DATA=__REVIEW_DATA__;
const KEY='task40-chronological-review-v1';
const actionMap=new Map(DATA.actions.map(a=>[a.id,a]));
const collapsedSteps=new WeakSet();
const records=new Map(DATA.videos.map(v=>[v.segment_id,{video_id:v.segment_id,coverage:'',quality:'unreviewed',steps:[],reviewed:false}]));
const message=document.querySelector('#message');
function el(tag,attrs={},text=''){const node=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')node.className=v;else node.setAttribute(k,v);}if(text)node.textContent=text;return node;}
function options(select,items,placeholder){select.replaceChildren();if(placeholder!==null)select.append(el('option',{value:''},placeholder));for(const [v,t] of items)select.append(el('option',{value:v},t));}
function vocabulary(){const list=el('ul');for(const a of DATA.actions){const li=el('li');li.append(el('b',{},a.label+'：'),document.createTextNode(a.states.map(x=>x[1]).join('；')));list.append(li);}document.querySelector('#vocabulary').append(list);}
function cardFor(id){return [...document.querySelectorAll('.review-card')].find(c=>c.dataset.id===id);}
function stepComplete(s){return actionMap.has(s.action)&&actionMap.get(s.action).states.some(x=>x[0]===s.state)&&(s.action!=='other'||s.notes.trim().length>0);}
function incompleteSteps(r){return r.steps.flatMap((s,i)=>{const missing=[];if(!actionMap.has(s.action))missing.push('动作');else if(!actionMap.get(s.action).states.some(x=>x[0]===s.state))missing.push('结果');if(s.action==='other'&&!s.notes.trim())missing.push('其他动作说明');return missing.length?[{step:i+1,missing}]:[];});}
function completionMessage(r){const missing=incompleteSteps(r);if(missing.length)return `还不能确认：${missing.map(x=>`第 ${x.step} 步缺少${x.missing.join('和')}`).join('；')}。补齐后再确认。`;if(!r.steps.length&&!['no_event','unreadable','wrong'].includes(r.quality))return '还不能确认：没有记录步骤。请添加画面中发生的动作，或在“视频有问题时才选”中标记“没有相关操作 / 画面无法辨认 / 视频定位错误”。';return '';}
function update(){let n=0;for(const [id,r] of records){const c=cardFor(id),cb=c.querySelector('[data-reviewed]'),problem=completionMessage(r);cb.checked=r.reviewed;c.classList.toggle('done',r.reviewed);c.querySelector('.card-state').textContent=r.reviewed?'已确认这段的顺序与状态':problem?problem:r.steps.length?'顺序与状态已填写，可确认':'请先说明为何没有步骤';if(r.reviewed)n++;}document.querySelector('#progress').textContent=`已确认 ${n} / ${records.size} 个视频`;}
function save(quiet=false){try{localStorage.setItem(KEY,JSON.stringify(collect()));if(!quiet)message.textContent='已保存到当前浏览器';}catch{message.textContent='浏览器无法保存草稿，请导出 JSON 保留标注';}}
function changed(r){r.reviewed=false;const c=cardFor(r.video_id);c.querySelector('.confirm-feedback').textContent='';update();save(true);}
function collect(){return {schema_version:4,taxonomy_version:'task40-observed-sequence-v1',annotation_source:'human',videos:DATA.videos.map(v=>{const r=records.get(v.segment_id);return {...r,steps:r.steps.map((s,i)=>({...s,order:i+1,action_label:actionMap.get(s.action)?.label||'',state_label:actionMap.get(s.action)?.states.find(x=>x[0]===s.state)?.[1]||'',detail_label:actionMap.get(s.action)?.details.find(x=>x[0]===s.detail)?.[1]||''})),source:{source_episode_id:v.source_episode_id,source_video_sha256:v.source_video_sha256,source_duration_seconds:v.full_duration,candidate_start_seconds:v.start,candidate_end_seconds:v.end}};})};}
function blankStep(){return {action:'',state:'',detail:'unspecified',source_time_seconds:null,time_view:null,notes:''};}
function renderSteps(id){const r=records.get(id),c=cardFor(id),list=c.querySelector('.steps');list.replaceChildren();if(!r.steps.length)list.append(el('p',{class:'empty'},'还没有步骤。点击“添加下一步”，从画面里最先看到的动作开始。'));
 r.steps.forEach((s,index)=>{const row=el('div',{class:'step','data-index':index}),head=el('div',{class:'step-head'}),title=el('div',{class:'step-title'}),summary=el('span',{class:'step-summary'});title.append(el('strong',{},`第 ${index+1} 步`),summary);head.append(title);const body=el('div',{class:'step-body',id:`${id}-step-body-${index}`}),toggle=el('button',{type:'button',class:'step-toggle','aria-controls':body.id});function refreshSummary(){const a=actionMap.get(s.action),state=a?.states.find(x=>x[0]===s.state)?.[1],detail=a?.details.find(x=>x[0]===s.detail)?.[1];summary.textContent=[a?.label||'尚未选择动作',state||'结果待选',s.detail!=='unspecified'?detail:''].filter(Boolean).join(' · ');}function setCollapsed(value){if(value)collapsedSteps.add(s);else collapsedSteps.delete(s);body.hidden=value;toggle.textContent=value?'展开':'收起';toggle.setAttribute('aria-expanded',String(!value));}setCollapsed(collapsedSteps.has(s));refreshSummary();toggle.onclick=()=>setCollapsed(!body.hidden);head.append(toggle);
 for(const [label,offset] of [['↑',-1],['↓',1]]){const b=el('button',{type:'button','aria-label':offset<0?'上移这一步':'下移这一步'},label);b.disabled=index+offset<0||index+offset>=r.steps.length;b.onclick=()=>{[r.steps[index],r.steps[index+offset]]=[r.steps[index+offset],r.steps[index]];renderSteps(id);changed(r);};head.append(b);}
 const insert=el('button',{type:'button'},'在此后插一步');insert.onclick=()=>{r.steps.splice(index+1,0,blankStep());renderSteps(id);changed(r);};head.append(insert);
 const remove=el('button',{type:'button'},'删除');remove.onclick=()=>{r.steps.splice(index,1);renderSteps(id);changed(r);};head.append(remove);row.append(head);
 const fields=el('div',{class:'fields'}),actionLabel=el('label',{},'做了什么'),actionSelect=el('select',{'data-action':''});options(actionSelect,DATA.actions.map(a=>[a.id,a.label]),'选择画面中的动作');actionSelect.value=s.action;actionLabel.append(actionSelect);
 const stateLabel=el('label',{},'结果怎样'),stateSelect=el('select',{'data-result':''});options(stateSelect,actionMap.get(s.action)?.states||[],'选择这个动作的结果');stateSelect.value=s.state;stateSelect.disabled=!s.action;stateLabel.append(stateSelect);fields.append(actionLabel,stateLabel);body.append(fields);
 const extra=el('div',{class:'extra'}),detailSelect=el('select',{'data-detail':'','aria-label':'可见情况补充'}),a=actionMap.get(s.action);options(detailSelect,a?.details||[['unspecified','不补充/看不清']],null);detailSelect.value=s.detail;detailSelect.hidden=!(a?.details.length>1);extra.append(detailSelect);
 const stamp=el('button',{type:'button'},'记下当前画面时间（可选）'),time=el('span',{class:'time-label'},s.source_time_seconds===null?'未记时间':`原视频 ${s.source_time_seconds.toFixed(2)} 秒`);stamp.onclick=()=>{const v=c.querySelector('video'),meta=DATA.videos.find(v=>v.segment_id===id);s.source_time_seconds=Number((v.currentTime+(c.dataset.view==='clip'?meta.start:0)).toFixed(3));s.time_view=c.dataset.view;time.textContent=`原视频 ${s.source_time_seconds.toFixed(2)} 秒`;changed(r);};extra.append(stamp,time);body.append(extra);
 const notes=el('input',{class:'step-note',type:'text',placeholder:s.action==='other'?'请写一句看见的动作（此项必填）':'补充一句（可选）','aria-label':'步骤备注'});notes.value=s.notes;notes.oninput=()=>{s.notes=notes.value;changed(r);};body.append(notes);row.append(body);
 actionSelect.onchange=()=>{s.action=actionSelect.value;s.state=s.action==='unclear'?'unknown':'';s.detail='unspecified';renderSteps(id);changed(r);};stateSelect.onchange=()=>{s.state=stateSelect.value;refreshSummary();changed(r);};detailSelect.onchange=()=>{s.detail=detailSelect.value;refreshSummary();changed(r);};list.append(row);});
}
function makeCard(meta){const id=meta.segment_id,r=records.get(id),c=el('article',{class:'review-card','data-id':id,'data-view':'full'}),head=el('header');head.append(el('h2',{},`视频 ${id}`),el('span',{},`完整回合 ${meta.full_duration.toFixed(1)} 秒 · 三路相机`));c.append(head);
 const player=el('div',{class:'player'}),video=el('video',{controls:'',preload:'metadata',playsinline:'',src:meta.full_video_url}),readout=el('div',{class:'readout'},'原视频 0.00 秒');player.append(video,readout);c.append(player);
 const controls=el('div',{class:'view-controls'}),full=el('button',{type:'button'},'看完整回合'),clip=el('button',{type:'button'},'只看定位短片'),slow=el('button',{type:'button'},'0.5 倍播放'),viewLabel=el('span',{class:'view-label'},'当前：完整回合');controls.append(full,clip,slow,viewLabel);c.append(controls);
 function setView(kind){video.pause();c.dataset.view=kind;video.src=kind==='full'?meta.full_video_url:meta.video_url;viewLabel.textContent=kind==='full'?'当前：完整回合':`当前：定位短片，原视频 ${meta.start.toFixed(2)}–${meta.end.toFixed(2)} 秒`;video.load();tick();}full.onclick=()=>setView('full');clip.onclick=()=>setView('clip');slow.onclick=()=>{video.playbackRate=video.playbackRate===.5?1:.5;slow.textContent=video.playbackRate===.5?'恢复原播放速度':'0.5 倍播放';};
 function tick(){const source=video.currentTime+(c.dataset.view==='clip'?meta.start:0);let step=`动作步约 ${Math.round(source*meta.scale)}（近似换算）`;if(meta.frames.length){const f=Math.round(source*meta.fps),nearest=meta.frames.reduce((a,b)=>Math.abs(a.frame_index-f)<=Math.abs(b.frame_index-f)?a:b);step=`最近记录动作步 ${nearest.action_steps}`;}readout.textContent=`原视频 ${source.toFixed(2)} 秒 · ${step}`;}video.addEventListener('timeupdate',tick);video.addEventListener('loadedmetadata',tick);video.addEventListener('seeked',tick);
 const stepTools=el('div',{class:'step-tools'});for(const [label,collapse] of [['全部收起',true],['全部展开',false]]){const button=el('button',{type:'button','data-collapse-all':String(collapse)},label);button.onclick=()=>{for(const s of r.steps){if(collapse)collapsedSteps.add(s);else collapsedSteps.delete(s);}renderSteps(id);};stepTools.append(button);}c.append(stepTools);
 c.append(el('div',{class:'steps'}));const add=el('button',{type:'button',class:'primary','data-add':''},'＋ 添加下一步');add.onclick=()=>{for(const s of r.steps)if(stepComplete(s))collapsedSteps.add(s);r.steps.push(blankStep());renderSteps(id);changed(r);};c.append(add);
 const qualityLabel=el('label',{class:'quality'},'视频有问题时才选（可选）：'),quality=el('select',{'data-quality':''});options(quality,[['unreviewed','无须补充'],['extra','有多余/重复画面'],['truncated','动作被截断，结果没拍到'],['wrong','视频/定位错误'],['no_event','没有相关操作'],['unreadable','画面无法辨认']],null);quality.onchange=()=>{r.quality=quality.value;changed(r);};qualityLabel.append(quality);c.append(qualityLabel);
 const finish=el('label',{class:'finish'}),reviewed=el('input',{type:'checkbox','data-reviewed':''}),feedback=el('p',{class:'confirm-feedback','role':'alert','aria-live':'polite'});reviewed.onchange=()=>{const warning=reviewed.checked?completionMessage(r):'';if(warning){r.reviewed=false;reviewed.checked=false;feedback.textContent=warning;}else{r.reviewed=reviewed.checked;feedback.textContent='';}update();save(true);};finish.append(reviewed,document.createTextNode('这段实际看到的动作已按顺序记完'),el('span',{class:'card-state'}));c.append(finish,feedback);return c;}
function apply(data){if(data.taxonomy_version!=='task40-observed-sequence-v1'||!Array.isArray(data.videos))throw Error('请选择本版“顺序标注”JSON；旧阶段标签无法自动变成动作顺序。');const ids=new Set();for(const row of data.videos){if(!records.has(row.video_id)||ids.has(row.video_id))throw Error('JSON 视频编号不匹配或重复');ids.add(row.video_id);const meta=DATA.videos.find(v=>v.segment_id===row.video_id);if(row.source?.source_video_sha256!==meta.source_video_sha256)throw Error('视频来源与当前数据不一致');if(!Array.isArray(row.steps))throw Error('步骤格式错误');for(const s of row.steps){const a=actionMap.get(s.action);if(s.action&&!a)throw Error('动作选项不存在');if(s.state&&!a?.states.some(x=>x[0]===s.state))throw Error('结果与动作不匹配');if(s.source_time_seconds!==null&&(!Number.isFinite(s.source_time_seconds)||s.source_time_seconds<0||s.source_time_seconds>meta.full_duration+.1))throw Error('步骤时间超出视频范围');}}
 for(const row of data.videos){const r=records.get(row.video_id);r.coverage=row.coverage||'';r.quality=row.quality||'unreviewed';r.reviewed=!!row.reviewed;r.steps=row.steps.map(s=>({...blankStep(),...s}));for(const s of r.steps)if(stepComplete(s))collapsedSteps.add(s);const c=cardFor(row.video_id);c.querySelector('[data-quality]').value=r.quality;renderSteps(row.video_id);}update();}
vocabulary();for(const meta of DATA.videos){document.querySelector('#cards').append(makeCard(meta));renderSteps(meta.segment_id);}document.querySelector('#dataset-info').textContent=`${DATA.videos.length} 个已有视频。默认播放完整回合；短片仅用于定位。同一动作可出现多次。没有看到的行为不用补写。`;
document.querySelector('#save').onclick=()=>save();document.querySelector('#export').onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(collect(),null,2)+'\n'],{type:'application/json'}));a.download='task40_human_sequence_annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);message.textContent='已导出，包含未完成的草稿及完成标记';};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{try{if(!e.target.files[0])return;apply(JSON.parse(await e.target.files[0].text()));save();message.textContent='已恢复本版顺序标注';}catch(err){message.textContent=err.message;}};
try{const draft=JSON.parse(localStorage.getItem(KEY)||'null');if(draft)apply(draft);}catch(err){message.textContent='草稿未载入：'+err.message;}update();
</script></main></body></html>
